<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>行迹 · iPhone 位置模拟</title>
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<style>
:root{--ink:#203650;--blue:#285ccd;--line:#dce4ee;--paper:#f7f9fc;--muted:#65768b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:10px 13px;font-size:13px;font-weight:600}button:hover{border-color:var(--blue);color:var(--blue)}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:focus-visible,input:focus-visible{outline:3px solid #99b8ff;outline-offset:2px}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:white;border-bottom:1px solid var(--line)}.brand{display:flex;gap:14px;align-items:center}.brand svg{width:34px;height:34px}h1{font-size:23px;margin:0;font-weight:650;letter-spacing:2px}.subtitle{font-size:12px;color:var(--muted);margin-top:4px}.connection{display:flex;gap:12px;align-items:center;font-size:13px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#8a99aa;margin-right:7px}.dot.on{background:#208174}main{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 78px)}aside{padding:24px;overflow:auto;background:white;border-right:1px solid var(--line)}h2{font-size:16px;margin:0 0 10px}p{font-size:13px;line-height:1.75;color:var(--muted);margin:0 0 16px}.section{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1;width:100%}input{border:1px solid #cbd6e5;border-radius:7px;padding:9px 10px;background:var(--paper);color:var(--ink);width:100%}label{font-size:13px;display:block;margin-bottom:14px}label span{display:flex;justify-content:space-between;margin-bottom:7px}label em{font-style:normal;color:var(--muted);font-size:12px}.small{font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0 0}.stats b{font-size:21px;display:block;font-weight:550;margin-bottom:4px}.stats span{font-size:12px;color:var(--muted)}.wide{width:100%;margin-bottom:9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}#map{height:100%;background:#e7eef5;cursor:crosshair}.mapwrap{position:relative;min-width:0}.mapbar{position:absolute;top:18px;left:55px;right:18px;z-index:500;display:flex;align-items:center;gap:10px;pointer-events:none}.mapbar>*{pointer-events:auto}.hint{background:white;border:1px solid var(--line);border-radius:9px;padding:11px 16px;font-size:13px;box-shadow:0 3px 18px #20365010}.mapbar button{margin-left:auto;box-shadow:0 3px 18px #20365010}.telemetry{position:absolute;bottom:28px;left:24px;right:24px;background:#ffffffed;z-index:500;border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center;box-shadow:0 4px 25px #20365015}.telemetry b{font-size:14px;display:block;margin-bottom:4px}.telemetry small{color:var(--muted)}progress{height:5px;width:100%;accent-color:var(--blue);display:block;margin-top:9px}.progresswrap{flex:1;max-width:320px}#message{min-height:20px;font-size:12px;line-height:1.65;color:#aa3848;margin:10px 0}.waypoint{background:white;border:2px solid var(--blue);border-radius:50%;text-align:center;font:600 11px/18px -apple-system;color:var(--blue);box-shadow:0 1px 6px #0002}#legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px}#legend i{width:18px;height:3px;display:inline-block;vertical-align:middle;margin-right:5px}.leaflet-control-attribution{font-size:10px!important}@media(max-width:760px){header{padding:0 14px}.connection span{display:none}main{grid-template-columns:270px 1fr}aside{padding:18px}.mapbar{left:50px}.hint{display:none}.telemetry{left:10px;right:10px;padding:12px;flex-wrap:wrap}}@media(max-width:540px){main{display:flex;flex-direction:column-reverse;height:auto}.mapwrap{height:55vh}aside{overflow:visible}.telemetry{bottom:22px}header{height:70px}.subtitle{font-size:10px}}

.segment-row{border-top:1px solid var(--line);padding:12px 0}.segment-row summary{cursor:pointer;font-size:13px;font-weight:600;padding:4px 0}.segment-row .inherit{display:flex;align-items:center;gap:8px;margin:10px 0}.segment-row input[type=checkbox]{width:auto}.segment-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.segment-fields label{font-size:11px;margin-bottom:8px}.segment-fields input{padding:7px 5px}.segment-fields input:disabled{opacity:.5}.segment-stats{font-size:11px;color:var(--muted);margin:3px 0}
</style>
<header><div class="brand"><svg viewBox="0 0 36 36" fill="none"><path d="M8 27V13c0-8 20-8 20 1s-20 2-20 13c0 7 20 6 20-1" stroke="#285ccd" stroke-width="2.5"/><circle cx="8" cy="27" r="4" fill="white" stroke="#285ccd" stroke-width="2.5"/><circle cx="28" cy="26" r="3" fill="#285ccd"/></svg><div><h1>行迹</h1><div class="subtitle">在地图上规划 iPhone 的模拟位置</div></div></div><div class="connection"><span id="device"><i class="dot"></i>尚未连接</span><button id="connect">连接 iPhone</button></div></header>
<main><aside><div class="section"><h2>画一条路线</h2><p>依次点击地图添加途经点，拖动圆点调整。各段可设置直线或弧线，以及独立速度。</p><div class="row"><input id="lat" aria-label="跳转纬度" type="number" step="any" value="39.9042"><input id="lon" aria-label="跳转经度" type="number" step="any" value="116.4074"><button id="jump">跳转</button></div><p class="small" style="margin:6px 0 12px">纬度 / 经度 · WGS84</p><div class="row"><button id="undo">撤销一点</button><button id="reset">清空路线</button></div><div class="stats"><div><b id="distance">—</b><span>路线长度</span></div><div><b id="duration">—</b><span>预计时长</span></div></div></div>
<div class="section"><h2>全局参数</h2><label><span>移动速度<em>米 / 秒</em></span><input id="speed" type="number" value="1.4" min="0" step="any"></label><label><span>发送间隔<em>秒</em></span><input id="interval" type="number" value="1" min="0" step="any"></label><label><span>平滑位置噪声<em>每轴幅度 · 米</em></span><input id="noise" type="number" value="2" min="0" step="any"></label><label><span>弧线弯曲量<em>米 · 正数左弯，负数右弯</em></span><input id="bend" type="number" value="0" step="any"></label><label><span>随机最低速度<em>米 / 秒</em></span><input id="speed_min" type="number" value="0" min="0" step="any"></label><label><span>随机最高速度<em>米 / 秒</em></span><input id="speed_max" type="number" value="0" min="0" step="any"></label><p class="small">弯曲量为 0 时走直线；随机速度上下限均为 0 时使用固定速度。随机速度在范围内保持一段快走或慢跑节奏，逐渐加减速并伴随轻微波动。每次生成会换一组节奏。</p><div id="segments"></div><button id="preview" class="wide">生成轨迹预览</button><div id="legend"><span><i style="background:#8d9db1"></i>规划路线</span><span><i style="background:#285ccd"></i>模拟轨迹</span></div></div>
<button id="start" class="primary wide">开始发送到 iPhone</button><div class="controls"><button id="pause">暂停</button><button id="stop">停止发送</button></div><button id="clear" class="wide">恢复真实定位</button><p class="small">暂停、停止或走完路线后，保留最后模拟位置。点击恢复真实定位即可清除。</p><div id="message" role="status" aria-live="polite"></div></aside>
<div class="mapwrap"><div id="map"></div><div class="mapbar"><div id="hint" class="hint">点击地图，选择起点</div><button id="fit">查看整条路线</button></div><div class="telemetry"><div><b id="mode">等待规划路线</b><small id="position">尚未发送坐标</small></div><div class="progresswrap"><small id="progressText">0 个点已发送</small><progress id="progress" value="0" max="1"></progress></div></div></div></main>
<script src="/static/vendor/leaflet.js"></script><script>window.LOCAL_TOKEN='__TOKEN__';</script><script src="/static/app.js"></script>
</html>
